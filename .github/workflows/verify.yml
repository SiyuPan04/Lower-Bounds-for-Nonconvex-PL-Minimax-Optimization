name: Formal Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build project
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false

      - name: Run package hygiene and axiom audit
        shell: pwsh
        run: ./Build.ps1
